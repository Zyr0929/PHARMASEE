<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PharmaSEE — Mobile Scanner</title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- html5-qrcode (CDN) -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- Socket.io client (served by the Express server) -->
  <script src="/socket.io/socket.io.js"></script>

  <style>
    body { background: #F8F9FA; color: #353535; }
    #reader { width: 100%; max-width: 400px; margin: 0 auto; }
    #reader video { border-radius: 12px; }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4 font-sans bg-[#F8F9FA] text-[#353535]">

  <!-- Header -->
  <div class="text-center mb-6">
    <h1 class="text-3xl font-extrabold text-[#000000] tracking-wide">Pharma<span class="text-[#ED1B24]">SEE</span></h1>
    <p class="text-slate-500 text-sm mt-1">Mobile Barcode Scanner</p>
  </div>

  <!-- Scanner viewport -->
  <div id="reader" class="rounded-xl overflow-hidden shadow-md border border-[#E0E0E0] bg-white"></div>

  <!-- Status messages -->
  <div id="status" class="mt-6 text-center">
    <p class="text-slate-500 text-sm font-medium">Point your camera at a barcode…</p>
  </div>

  <!-- Last scanned feedback -->
  <div id="lastScanned" class="hidden mt-4 bg-emerald-50 border border-emerald-200 rounded-lg px-6 py-3 text-center shadow-xs">
    <p class="text-xs text-[#2D9A33] uppercase tracking-wider font-semibold">Last Scanned</p>
    <p id="lastCode" class="text-lg font-mono font-bold text-[#2D9A33] mt-1"></p>
  </div>

  <!-- Connection indicator -->
  <div id="connection" class="fixed bottom-4 left-4 flex items-center gap-2 bg-white border border-[#E0E0E0] shadow-sm rounded-full px-3.5 py-1.5 text-xs">
    <span id="connDot" class="w-2 h-2 rounded-full bg-[#ED1B24]"></span>
    <span id="connText" class="text-slate-500 font-medium">Disconnected</span>
  </div>

  <script>
    // ---- Socket.io connection ----
    const socket = io();
    const connDot  = document.getElementById('connDot');
    const connText = document.getElementById('connText');

    socket.on('connect', () => {
      connDot.className  = 'w-2 h-2 rounded-full bg-[#2D9A33]';
      connText.textContent = 'Connected';
      connText.className   = 'text-[#2D9A33] font-semibold';
    });

    socket.on('disconnect', () => {
      connDot.className  = 'w-2 h-2 rounded-full bg-[#ED1B24]';
      connText.textContent = 'Disconnected';
      connText.className   = 'text-[#ED1B24] font-semibold';
    });

    // ---- Barcode scanner (html5-qrcode) ----
    const html5QrCode = new Html5Qrcode('reader');

    // Debounce: prevent rapid duplicate scans
    let lastBarcode = '';
    let lastTime    = 0;

    function onScanSuccess(decodedText) {
      const now = Date.now();
      if (decodedText === lastBarcode && now - lastTime < 2000) return; // 2-second cooldown

      lastBarcode = decodedText;
      lastTime    = now;

      // Send to server via Socket.io
      socket.emit('barcode-scanned', decodedText);

      // UI feedback
      document.getElementById('lastScanned').classList.remove('hidden');
      document.getElementById('lastCode').textContent = decodedText;

      // Brief vibration feedback (if supported)
      if (navigator.vibrate) navigator.vibrate(100);
    }

    html5QrCode.start(
      { facingMode: 'environment' },
      {
        fps: 10,
        qrbox: { width: 280, height: 150 },
        aspectRatio: 1.5,
      },
      onScanSuccess
    ).catch(err => {
      document.getElementById('status').innerHTML =
        `<p class="text-[#ED1B24] text-sm font-semibold">Camera error: ${err}</p>`;
    });
  </script>
</body>
</html>
